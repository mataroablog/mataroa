name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Prevent concurrent deployments
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      MATAROA_CHATGPT_ENABLED: ${{ vars.MATAROA_CHATGPT_ENABLED == '1' && '1' || '0' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s %s\n' "${{ vars.SERVER_IP }}" \
            'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKRWNGMNx3TJ/s9T3IXOyYUHqg30OSp40ke1ahFKN/TE' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -S ~/.ssh/deploy-control \
            -o StrictHostKeyChecking=yes -o ControlMaster=yes -o ControlPersist=yes -N -f \
            ${{ secrets.SERVER_USER }}@${{ vars.SERVER_IP }}

      - name: Pull latest code
        run: |
          ssh -i ~/.ssh/id_ed25519 -S ~/.ssh/deploy-control ${{ secrets.SERVER_USER }}@${{ vars.SERVER_IP }} \
            "sudo -u deploy bash -c 'cd /var/www/mataroa && git pull'"

      - name: Update Python dependencies
        run: |
          ssh -i ~/.ssh/id_ed25519 -S ~/.ssh/deploy-control ${{ secrets.SERVER_USER }}@${{ vars.SERVER_IP }} \
            "sudo -u deploy bash -c 'cd /var/www/mataroa && /home/deploy/.local/bin/uv sync --extra chatgpt --all-groups'"

      - name: Run database migrations
        run: |
          ssh -i ~/.ssh/id_ed25519 -S ~/.ssh/deploy-control ${{ secrets.SERVER_USER }}@${{ vars.SERVER_IP }} \
            "sudo -u deploy bash -c 'cd /var/www/mataroa && export DATABASE_URL=\"${{ secrets.DATABASE_URL }}\" MATAROA_CHATGPT_ENABLED=$MATAROA_CHATGPT_ENABLED && /home/deploy/.local/bin/uv run --extra chatgpt python manage.py migrate --no-input'"

      - name: Collect static files
        run: |
          ssh -i ~/.ssh/id_ed25519 -S ~/.ssh/deploy-control ${{ secrets.SERVER_USER }}@${{ vars.SERVER_IP }} \
            "sudo -u deploy bash -c 'cd /var/www/mataroa && export MATAROA_CHATGPT_ENABLED=$MATAROA_CHATGPT_ENABLED && /home/deploy/.local/bin/uv run --extra chatgpt python manage.py collectstatic --no-input'"

      - name: Reload mataroa service
        run: |
          ssh -i ~/.ssh/id_ed25519 -S ~/.ssh/deploy-control ${{ secrets.SERVER_USER }}@${{ vars.SERVER_IP }} \
            "systemctl reload mataroa"

      - name: Cleanup SSH
        if: always()
        run: |
          ssh -S ~/.ssh/deploy-control -O exit ${{ secrets.SERVER_USER }}@${{ vars.SERVER_IP }} || true
          rm -f ~/.ssh/id_ed25519
