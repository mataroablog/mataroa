<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mataroa browser tests</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 32px; color: #222; }
    h1 { font: 32px Georgia, serif; }
    button, a { font: inherit; }
    button { padding: 6px 14px; margin-right: 16px; cursor: pointer; }
    .pass { color: #176434; } .fail { color: #b32020; }
    #results { padding-left: 24px; } li { margin: 8px 0; } pre { white-space: pre-wrap; }
    #fixture { position: fixed; right: 12px; bottom: 12px; width: 440px; max-width: 40vw; height: 45vh; background: white; border: 1px solid #ddd; }
    #fixture:empty { display: none; } iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <h1>Mataroa browser tests</h1>
  <p>Checks the real posts scripts with fictional posts and a simulated ChatGPT host.</p>
  <p><button id="run" disabled>Run again</button><a href="/preview/" target="_blank" rel="noopener">Open the preview</a></p>
  <p id="summary" role="status" aria-live="polite">Loading tests…</p>
  <ol id="results"></ol>
  <div id="fixture"></div>
  <script type="module">
    try {
      const { run } = await import('./runner.js');
      for (const name of ['model', 'library', 'bridge', 'app']) await import(`./${name}.test.js`);
      document.getElementById('run').addEventListener('click', run);
      await run();
    } catch (error) {
      document.getElementById('summary').textContent = `Could not run tests: ${error.message}`;
      document.getElementById('summary').className = 'fail';
    }
  </script>
</body>
</html>
