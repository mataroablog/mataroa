<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mataroa fixture preview</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}iframe{display:block}</style></head>
<body>
  <iframe sandbox="allow-scripts" title="Mataroa posts preview"></iframe>
  <script type="module">
    import { fixtureHost } from '/fixture-host.js';
    const params = new URLSearchParams(location.search);
    const frame = document.querySelector('iframe');
    fixtureHost(frame, { mode: params.get('mode') || 'normal', theme: params.get('theme') || 'light', opaque: true });
    frame.src = '/library.html';
  </script>
</body>
</html>
